version: '3'

services:
  frontend_dev:
    container_name: admin_frontend_dev
    build:
      context: ../../front_admin
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../../front_admin:/app:delegated
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://nestjs_app_dev:3000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - nestjs_app_dev
    networks:
      - app_network

  nestjs_app_dev:
    container_name: nestjs_app_dev
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "9229:9229"
    volumes:
      - ../../backend:/usr/src/app:delegated
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER_DEV}:${POSTGRES_PASSWORD_DEV}@db_dev:5432/${POSTGRES_DB_DEV}?schema=public
      - DATABASE_HOST=db_dev
      - DATABASE_PORT=5432
      - DATABASE_NAME=${POSTGRES_DB_DEV}
      - DATABASE_USER=${POSTGRES_USER_DEV}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD_DEV}
      - MAIL_FROM=noreply@yourapp.com
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
      - WATCHPACK_POLLING=true
    command: yarn start:dev
    depends_on:
      - db_dev
    networks:
      - app_network

  db_dev:
    container_name: database
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB_DEV}
      POSTGRES_USER: ${POSTGRES_USER_DEV}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_DEV} -d ${POSTGRES_DB_DEV}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db_dev
      - ADMINER_DESIGN=flat
    depends_on:
      - db_dev
    networks:
      - app_network

  mailhog:
    container_name: mailhog
    image: mailhog/mailhog
    ports:
      - "1025:1025" # Port SMTP
      - "8025:8025" # Interface Web
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pgdata_dev:
    driver: local
  frontend_node_modules:
    driver: local