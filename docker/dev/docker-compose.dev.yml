version: '3.8'

services:
  frontend_dev:
    container_name: admin_frontend_dev
    build:
      context: ../../front_admin
      dockerfile: Dockerfile
      target: runner
    ports:
      - "5173:5173"
    volumes:
      - ../../front_admin:/app:delegated
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://nestjs_app_dev:3000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      nestjs_app_dev:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nestjs_app_dev:
    container_name: nestjs_app_dev
    build:
      context: ../../backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "9229:9229"
    volumes:
      - ../../backend:/app:delegated
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      # Base de données
      - DATABASE_URL=postgresql://${POSTGRES_USER_DEV}:${POSTGRES_PASSWORD_DEV}@db_dev:5432/${POSTGRES_DB_DEV}?schema=public
      - DATABASE_HOST=db_dev
      - DATABASE_PORT=5432
      - DATABASE_NAME=${POSTGRES_DB_DEV}
      - DATABASE_USER=${POSTGRES_USER_DEV}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD_DEV}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - REDIS_TTL=86400
      # Email
      - MAIL_FROM=noreply@yourapp.com
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      # Hot Reloading
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500
      - WATCHPACK_POLLING=true
    command: yarn start:dev
    depends_on:
      db_dev:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db_dev:
    container_name: database
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB_DEV}
      - POSTGRES_USER=${POSTGRES_USER_DEV}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_DEV}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_DEV} -d ${POSTGRES_DB_DEV}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  redis:
    container_name: redis
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db_dev
      - ADMINER_DESIGN=flat
      - ADMINER_PLUGINS=tables-filter tinymce
    depends_on:
      db_dev:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  mailhog:
    container_name: mailhog
    image: mailhog/mailhog
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Interface Web
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

networks:
  app_network:
    driver: bridge
    name: pony_market_network
    labels:
      - "com.ponymarket.description=Réseau principal de développement"

volumes:
  pgdata_dev:
    driver: local
    name: pony_market_pgdata_dev
  frontend_node_modules:
    driver: local
    name: pony_market_frontend_modules
  redis_data:
    driver: local
    name: pony_market_redis_data
  nestjs_dist:
    driver: local
    name: nestjs_dist_${NODE_ENV:-development}

# Configurations globales
x-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "3"
  driver: json-file